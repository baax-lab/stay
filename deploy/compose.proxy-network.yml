# Variante B: Reverse Proxy läuft selbst als Container (Caddy, Traefik, nginx-proxy) in einem eigenen Docker-Netz.
# Die App tritt diesem vorhandenen Netz bei; die Datenbank bleibt im internen Netz von baax-stay.
# Netzname prüfen: docker network ls  (PROXY_NETWORK in .env.production setzen)
#
#   docker compose -f docker-compose.yml -f deploy/compose.proxy-network.yml --env-file .env.production up -d --build
services:
  app:
    networks:
      default:
      proxy:
        # Im Proxy-Netz unter eindeutigem Namen erreichbar (Caddy/nginx: reverse_proxy baax-stay:3000), nie als „app“
        aliases: ["${STAY_ROUTER:-baax-stay}"]
    labels:
      # Für Traefik (wird von Caddy/nginx ignoriert). STAY_ROUTER je Umgebung eindeutig (Produktion/Staging)
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.${STAY_ROUTER:-baax-stay}.rule=Host(`${STAY_DOMAIN:-stay.baax.de}`)
      - traefik.http.routers.${STAY_ROUTER:-baax-stay}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${STAY_ROUTER:-baax-stay}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.${STAY_ROUTER:-baax-stay}.loadbalancer.server.port=3000

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
